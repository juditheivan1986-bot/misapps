<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Snake</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #080810;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #app {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
    gap: 10px;
  }
  #hud {
    display: flex; gap: 24px;
    font-size: clamp(12px, 3.5vw, 15px);
    color: #666;
  }
  #hud b { color: #fff; }
  #wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    flex: 1;
    max-height: 75vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    border: 1px solid #1e1e3a;
    border-radius: 12px;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(8,8,16,0.9);
    border-radius: 12px;
    gap: 10px;
    padding: 24px;
    z-index: 20;
  }
  #overlay h2 { font-size: clamp(22px, 6vw, 32px); color: #fff; font-weight: 700; }
  #overlay p { font-size: clamp(13px, 3.5vw, 15px); color: #666; line-height: 1.6; text-align: center; max-width: 260px; }
  .score-box { font-size: clamp(14px, 4vw, 17px); color: #7c6aff; font-weight: 600; }
  #play-btn {
    margin-top: 8px;
    background: #7c6aff; color: #fff; border: none;
    padding: 13px 38px; font-size: clamp(14px, 4vw, 17px); font-weight: 700;
    border-radius: 50px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
    box-shadow: 0 0 24px rgba(124,106,255,0.5);
  }
  #play-btn:active { transform: scale(0.95); }

  /* D-PAD */
  #dpad {
    display: none;
    position: relative;
    width: clamp(130px, 35vw, 160px);
    height: clamp(130px, 35vw, 160px);
    flex-shrink: 0;
  }
  .dpad-btn {
    position: absolute;
    width: 38%; height: 38%;
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; color: #aaa;
    touch-action: manipulation;
    -webkit-appearance: none; appearance: none;
  }
  .dpad-btn:active { background: rgba(124,106,255,0.25); color: #fff; }
  #btn-up    { top: 0;    left: 31%; }
  #btn-down  { bottom: 0; left: 31%; }
  #btn-left  { top: 31%;  left: 0; }
  #btn-right { top: 31%;  right: 0; }

  #controls {
    display: none;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 480px;
    gap: 20px;
    padding: 0 16px;
  }
  .ctrl-hint { font-size: clamp(11px, 2.5vw, 13px); color: #333; flex: 1; text-align: center; }

  @media (pointer: coarse) {
    #dpad { display: block; }
    #controls { display: flex; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span>⭐ <b id="score-el">0</b></span>
    <span>🏆 <b id="best-el">0</b></span>
    <span>⚡ <b id="level-el">1</b></span>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="overlay">
      <h2 id="o-title">🐍 Snake</h2>
      <p id="o-desc">Come manzanas para crecer. ¡No choques con las paredes ni contigo mismo!</p>
      <div id="o-score" class="score-box" style="display:none"></div>
      <button id="play-btn">¡Jugar!</button>
    </div>
  </div>
  <div id="controls">
    <div class="ctrl-hint">Desliza o usa el pad</div>
    <div id="dpad">
      <button class="dpad-btn" id="btn-up">▲</button>
      <button class="dpad-btn" id="btn-left">◀</button>
      <button class="dpad-btn" id="btn-right">▶</button>
      <button class="dpad-btn" id="btn-down">▼</button>
    </div>
    <div class="ctrl-hint"></div>
  </div>
</div>

<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('wrap');
  var overlay = document.getElementById('overlay');
  var oTitle = document.getElementById('o-title');
  var oDesc = document.getElementById('o-desc');
  var oScore = document.getElementById('o-score');
  var scoreEl = document.getElementById('score-el');
  var bestEl = document.getElementById('best-el');
  var levelEl = document.getElementById('level-el');
  var btn = document.getElementById('play-btn');

  var CELL = 20;
  var COLS, ROWS, W, H, dpr;
  var snake, dir, nextDir, food, score, best = 0, level, gameLoop, running = false;

  var SNAKE_HEAD = '#00e87a';
  var SNAKE_BODY = '#00c86e';
  var SNAKE_DARK = '#009950';
  var FOOD_COLOR = '#ff4d6d';
  var FOOD_GLOW  = '#ff4d6d';
  var POWER_COLOR = '#f39c12';

  var powerUp = null;
  var powerTimer = 0;
  var powered = false;
  var poweredTimer = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    var rect = wrap.getBoundingClientRect();
    var size = Math.min(rect.width, rect.height);
    COLS = Math.floor(size / CELL);
    ROWS = Math.floor(size / CELL);
    W = COLS * CELL;
    H = ROWS * CELL;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!running) drawIdle();
  }

  function rnd(max) { return Math.floor(Math.random() * max); }

  function spawnFood() {
    var pos;
    do {
      pos = { x: rnd(COLS), y: rnd(ROWS) };
    } while (snake.some(function(s){ return s.x === pos.x && s.y === pos.y; }));
    food = pos;
  }

  function spawnPower() {
    var pos;
    do {
      pos = { x: rnd(COLS), y: rnd(ROWS) };
    } while (snake.some(function(s){ return s.x === pos.x && s.y === pos.y; }) || (pos.x === food.x && pos.y === food.y));
    powerUp = pos;
    powerTimer = 8000;
  }

  function startGame() {
    var mid = Math.floor(COLS / 2);
    snake = [
      { x: mid, y: Math.floor(ROWS / 2) },
      { x: mid - 1, y: Math.floor(ROWS / 2) },
      { x: mid - 2, y: Math.floor(ROWS / 2) }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0; level = 1;
    scoreEl.textContent = 0;
    levelEl.textContent = 1;
    powerUp = null; powerTimer = 0;
    powered = false; poweredTimer = 0;
    running = true;
    spawnFood();
    overlay.style.display = 'none';
    clearInterval(gameLoop);
    tick();
    scheduleNext();
  }

  function getSpeed() {
    var base = Math.max(80, 220 - level * 18);
    return powered ? base * 0.65 : base;
  }

  var loopTimeout;
  function scheduleNext() {
    loopTimeout = setTimeout(function() {
      if (running) { tick(); scheduleNext(); }
    }, getSpeed());
  }

  function tick() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }
    // self collision
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) { endGame(); return; }
    }

    snake.unshift(head);

    // eat food
    if (head.x === food.x && head.y === food.y) {
      score += powered ? 20 : 10;
      level = Math.floor(snake.length / 5) + 1;
      scoreEl.textContent = score;
      levelEl.textContent = level;
      spawnFood();
      // spawn power-up every 5 food eaten (no power active)
      if (!powerUp && !powered && snake.length % 5 === 0) spawnPower();
    } else {
      snake.pop();
    }

    // eat power-up
    if (powerUp && head.x === powerUp.x && head.y === powerUp.y) {
      powered = true;
      poweredTimer = 4000;
      powerUp = null;
    }

    // timers
    if (powerUp) {
      powerTimer -= getSpeed();
      if (powerTimer <= 0) powerUp = null;
    }
    if (powered) {
      poweredTimer -= getSpeed();
      if (poweredTimer <= 0) powered = false;
    }

    if (score > best) { best = score; bestEl.textContent = best; }
    draw();
  }

  function endGame() {
    running = false;
    clearTimeout(loopTimeout);
    if (score > best) { best = score; bestEl.textContent = best; }
    oTitle.textContent = '💀 Game Over';
    oDesc.textContent = '';
    oScore.style.display = 'block';
    oScore.textContent = 'Puntuación: ' + score + '  |  Récord: ' + best;
    btn.textContent = '¡Reintentar!';
    overlay.style.display = 'flex';
  }

  function drawIdle() {
    ctx.fillStyle = '#080810';
    ctx.fillRect(0, 0, W, H);
    drawGrid();
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (var gx = 0; gx <= W; gx += CELL) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
    for (var gy = 0; gy <= H; gy += CELL) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
  }

  function draw() {
    ctx.fillStyle = '#080810';
    ctx.fillRect(0, 0, W, H);
    drawGrid();

    // border glow when powered
    if (powered) {
      ctx.strokeStyle = 'rgba(243,156,18,0.5)';
      ctx.lineWidth = 3;
      ctx.strokeRect(1.5, 1.5, W - 3, H - 3);
    }

    // food
    ctx.save();
    ctx.shadowColor = FOOD_GLOW;
    ctx.shadowBlur = 14;
    ctx.fillStyle = FOOD_COLOR;
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // power-up (star)
    if (powerUp) {
      ctx.save();
      ctx.shadowColor = POWER_COLOR;
      ctx.shadowBlur = 18;
      ctx.fillStyle = POWER_COLOR;
      var px = powerUp.x * CELL + CELL / 2;
      var py = powerUp.y * CELL + CELL / 2;
      drawStar(px, py, 5, CELL / 2 - 2, CELL / 4 - 1);
      ctx.restore();
    }

    // snake body
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var cx = s.x * CELL + CELL / 2;
      var cy = s.y * CELL + CELL / 2;
      var isHead = i === 0;
      var r = isHead ? CELL / 2 - 1 : CELL / 2 - 2;
      var color = isHead ? SNAKE_HEAD : (powered ? '#f39c12' : SNAKE_BODY);

      if (isHead) {
        ctx.save();
        ctx.shadowColor = powered ? POWER_COLOR : SNAKE_HEAD;
        ctx.shadowBlur = 16;
      }
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      if (isHead) {
        ctx.restore();
        // eyes
        var ex = dir.x * (CELL * 0.25);
        var ey = dir.y * (CELL * 0.25);
        var epx = dir.y * (CELL * 0.18);
        var epy = -dir.x * (CELL * 0.18);
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(cx + ex + epx, cy + ey + epy, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + ex - epx, cy + ey - epy, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawStar(cx, cy, pts, outer, inner) {
    ctx.beginPath();
    for (var i = 0; i < pts * 2; i++) {
      var ang = (i * Math.PI) / pts - Math.PI / 2;
      var r2 = i % 2 === 0 ? outer : inner;
      if (i === 0) ctx.moveTo(cx + r2 * Math.cos(ang), cy + r2 * Math.sin(ang));
      else ctx.lineTo(cx + r2 * Math.cos(ang), cy + r2 * Math.sin(ang));
    }
    ctx.closePath();
    ctx.fill();
  }

  // KEYBOARD
  var KEYS = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
  document.addEventListener('keydown', function(e) {
    var d = KEYS[e.key];
    if (!d) return;
    e.preventDefault();
    if (d[0] !== -dir.x || d[1] !== -dir.y) nextDir = { x: d[0], y: d[1] };
  });

  // D-PAD
  function dpadDir(dx, dy) {
    if (!running) return;
    if (dx !== -dir.x || dy !== -dir.y) nextDir = { x: dx, y: dy };
  }
  function addDpad(id, dx, dy) {
    var el = document.getElementById(id);
    el.addEventListener('touchstart', function(e){ e.preventDefault(); dpadDir(dx,dy); }, { passive:false });
    el.addEventListener('click', function(){ dpadDir(dx,dy); });
  }
  addDpad('btn-up', 0, -1);
  addDpad('btn-down', 0, 1);
  addDpad('btn-left', -1, 0);
  addDpad('btn-right', 1, 0);

  // SWIPE
  var touchStart = null;
  document.addEventListener('touchstart', function(e) {
    if (e.target.closest('#dpad') || e.target.closest('#play-btn')) return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!touchStart || !running) return;
    var dx = e.changedTouches[0].clientX - touchStart.x;
    var dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    var nd;
    if (Math.abs(dx) > Math.abs(dy)) nd = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
    else nd = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
    touchStart = null;
  }, { passive: true });

  // BUTTON
  btn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
  btn.addEventListener('touchend', function(e){ e.preventDefault(); e.stopPropagation(); startGame(); }, { passive:false });

  window.addEventListener('resize', function(){ resize(); });
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 300); });

  resize();
})();
</script>
</body>
</html>
